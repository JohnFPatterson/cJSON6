[package]
name = "cjson-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "C ABI shim for the Rust cJSON port. This is the only crate allowed to contain unsafe."

[lib]
name = "cjson"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
cjson-core = { path = "../cjson-core" }
libc = "0.2"
